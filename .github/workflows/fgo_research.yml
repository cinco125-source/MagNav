name: FGO Research

# ACTIVE experiments only (the ones still iterating). Settled studies live in
# fgo_research_stable.yml (workflow_dispatch). This keeps the push cycle at
# ~1 h instead of ~3 h.

on:
  push:
    branches:
      - 'claude/fgo-problem-research-**'
      - 'claude/continued-work-**'
    paths-ignore:
      - 'paper/**'
      - '**/*.md'
      # focused one-off studies with their own dedicated workflow (keep the heavy
      # active suite from re-running when only these change):
      - 'research/mpf_R_sweep.jl'
      - '.github/workflows/mpf_rsweep.yml'
      - 'research/coldstart_trace.jl'
      - '.github/workflows/coldstart_trace.yml'
      - 'research/mpf_clean.jl'
      - '.github/workflows/mpf_clean.yml'
      - 'research/mpf_fixed.jl'
      - 'research/mpf_warm.jl'
      - 'research/mpf_offnn.jl'
      - 'research/mpf_logw.jl'
      - 'research/mpf_online.jl'
      - 'research/mpf_nn.jl'
      - '.github/workflows/mpf_fixed.yml'
      - '.github/workflows/mpf_warm.yml'
      - '.github/workflows/mpf_offnn.yml'
      - '.github/workflows/fgo_research.yml'
  workflow_dispatch:

jobs:
  test:
    name: Tests - Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    permissions: # needed for julia-actions/cache to delete old caches
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
  benchmark:
    name: Active FGO experiments
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions: # actions: cache eviction; contents: commit result CSVs back
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: FGO breadth (window FGO vs EKF-online across lines/flights/maps)
        run: julia --project=. research/fgo_breadth.jl
        env:
          GKSwstype: '100'
      - name: MPF+TL+NN (particle filter with the EKF's neural network)
        run: julia --project=. research/mpf_nn.jl
        env:
          GKSwstype: '100'
      - name: TL-excitation timeline (early-maneuver reviewer question)
        run: julia --project=. research/tl_excitation.jl
        env:
          GKSwstype: '100'
      - name: Calibration-flight TL for the FGO fixed-TL ablation
        run: julia --project=. research/fgo_calTL.jl
        env:
          GKSwstype: '100'
      - name: Estimator x compensation grid (offline-NN cells + stacked offNN+onlineTL)
        run: julia --project=. research/comp_grid.jl
        env:
          GKSwstype: '100'
      - name: Commit result CSVs back to the branch
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # NOTE: fgo_breadth_results.csv is deliberately NOT committed back (the
          # EKF+TL+NN column carries run-to-run floating-point wiggle; the paper
          # pins the committed version; fresh copies ship as artifacts).
          for f in research/mpf_nn_results.csv \
                   research/tl_excitation.csv research/tl_excitation_summary.csv \
                   research/fgo_calTL_results.csv \
                   research/comp_grid_results.csv; do
            [ -f "$f" ] && git add -f "$f" || echo "skip missing $f"
          done
          if git diff --cached --quiet; then
            echo "No result CSVs to commit."
          else
            git commit -m "Add active-experiment result CSVs [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fgo-active-results
          path: |
            research/fgo_breadth_results.csv
            research/mpf_nn_results.csv
            research/tl_excitation.csv
            research/tl_excitation_summary.csv
            research/fgo_calTL_results.csv
            research/comp_grid_results.csv
          if-no-files-found: ignore
