name: FGO window-length sweep

# Focused: regenerate the line-1007.06 window-length ablation (Table "1007") under
# the marginalized (forward-filtered) window handoff. Runs only research/fgo_winlen.jl
# and commits fgo_winlen_results.csv back.

on:
  push:
    branches:
      - 'claude/continued-work-**'
    paths:
      - 'research/fgo_winlen.jl'
      - '.github/workflows/fgo_winlen.yml'
  workflow_dispatch:

jobs:
  winlen:
    name: FGO window-length sweep
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: FGO window-length sweep (1007.06)
        run: julia --project=. research/fgo_winlen.jl
        env:
          GKSwstype: '100'
      - name: Commit result CSV back to the branch
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f research/fgo_winlen_results.csv ] && git add -f research/fgo_winlen_results.csv || echo "no csv"
          if git diff --cached --quiet; then
            echo "No result CSV to commit."
          else
            git commit -m "Add FGO window-length sweep CSV (marginalized handoff) [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fgo-winlen-results
          path: research/fgo_winlen_results.csv
          if-no-files-found: ignore
