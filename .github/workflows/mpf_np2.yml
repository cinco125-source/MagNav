name: MPF particle-count N=8000/12000

# Completes the 1003.08 convergence curve (still descending at N=4000) at N in
# {8000, 12000}. Matched config (R=40 nT, roughen 5 m), offline-NN Mag 5. Runs only
# research/mpf_np2.jl.

on:
  push:
    branches:
      - 'claude/continued-work-**'
    paths:
      - 'research/mpf_np2.jl'
      - 'research/mpf_logw.jl'
      - '.github/workflows/mpf_np2.yml'
  workflow_dispatch:

jobs:
  np2:
    name: MPF particle-count N=8000/12000
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: MPF particle-count N=8000/12000
        run: julia --project=. research/mpf_np2.jl
        env:
          GKSwstype: '100'
      - name: Commit result CSV back to the branch
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f research/mpf_np2_results.csv ] && git add -f research/mpf_np2_results.csv || echo "no csv"
          if git diff --cached --quiet; then
            echo "No result CSV to commit."
          else
            git commit -m "Add MPF particle-count N=8000/12000 CSV [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mpf-np2-results
          path: research/mpf_np2_results.csv
          if-no-files-found: ignore
