name: MPF offline-NN compensated

# Frozen offline-NN compensation (:m1, trained on Flt1002+1006, applied cross-flight)
# feeding the REPAIRED native MPF (log weights, linear itp, thresh 0.1, roughening),
# with a plain EKF on the identical measurement as the estimator reference. Isolates
# measurement accuracy from online joint estimation. Runs only research/mpf_offnn.jl.

on:
  push:
    branches:
      - 'claude/continued-work-**'
    paths:
      - 'research/mpf_offnn.jl'
      - 'research/mpf_logw.jl'
      - '.github/workflows/mpf_offnn.yml'
  workflow_dispatch:

jobs:
  offnn:
    name: MPF offline-NN compensated
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: MPF offline-NN compensated
        run: julia --project=. research/mpf_offnn.jl
        env:
          GKSwstype: '100'
      - name: Commit result CSV back to the branch
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f research/mpf_offnn_results.csv ] && git add -f research/mpf_offnn_results.csv || echo "no csv"
          if git diff --cached --quiet; then
            echo "No result CSV to commit."
          else
            git commit -m "Add MPF offline-NN compensated CSV [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mpf-offnn-results
          path: research/mpf_offnn_results.csv
          if-no-files-found: ignore
