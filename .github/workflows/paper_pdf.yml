name: Paper PDF

# Compiles the TAES manuscript with the real IEEEtran class (TeX Live via
# xu-cheng/latex-action) and commits the vector figures + PDF back to the branch.
# Local pdflatex is unavailable in the dev sandbox, so this is the source of the
# genuine IEEEtran-formatted PDF.

on:
  push:
    branches:
      - 'claude/fgo-problem-research-**'
      - 'claude/continued-work-**'
    paths:
      - 'paper/**'
      - '.github/workflows/paper_pdf.yml'
  workflow_dispatch:

jobs:
  build-pdf:
    name: Compile IEEEtran PDF
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # Figures are committed build artifacts; regenerating them here would
      # require the flight data and would overwrite the curated versions.

      - name: Compile with IEEEtran (pdflatex + bibtex)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: taes_incremental.tex
          working_directory: paper
          latexmk_use_xelatex: false
          args: -pdf -bibtex -interaction=nonstopmode -halt-on-error

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: taes-fgo-magnav-pdf
          path: paper/taes_incremental.pdf
          if-no-files-found: error

      - name: Commit PDF and figures back to branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f paper/taes_incremental.pdf paper/figs/*.pdf
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Build IEEEtran PDF with figures [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
