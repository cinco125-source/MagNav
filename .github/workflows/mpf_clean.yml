name: MPF clean-signal control

# Focused: does the RBPF work on the COMPENSATED stinger (mag_1_c) even though it
# fails on the uncompensated cabin mag? Isolates PF sensitivity to residual
# interference from PF under-powering. Runs only research/mpf_clean.jl (~5 min) and
# commits mpf_clean_results.csv back.

on:
  push:
    branches:
      - 'claude/continued-work-**'
    paths:
      - 'research/mpf_clean.jl'
      - '.github/workflows/mpf_clean.yml'
  workflow_dispatch:

jobs:
  control:
    name: MPF clean-signal control
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: MPF clean-signal control
        run: julia --project=. research/mpf_clean.jl
        env:
          GKSwstype: '100'
      - name: Commit result CSV back to the branch
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f research/mpf_clean_results.csv ] && git add -f research/mpf_clean_results.csv || echo "no csv"
          if git diff --cached --quiet; then
            echo "No result CSV to commit."
          else
            git commit -m "Add MPF clean-signal control CSV [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mpf-clean-results
          path: research/mpf_clean_results.csv
          if-no-files-found: ignore
