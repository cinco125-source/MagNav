name: MPF R sweep

# Focused one-off: does raising the measurement variance R (or the particle count)
# rescue the diverging MPF+TL cold start? Runs only research/mpf_R_sweep.jl, so it
# is fast (~15 min) and does not re-run the full active suite. Triggers only when
# that script changes, plus manual dispatch.

on:
  push:
    branches:
      - 'claude/continued-work-**'
    paths:
      - 'research/mpf_R_sweep.jl'
      - '.github/workflows/mpf_rsweep.yml'
  workflow_dispatch:

jobs:
  sweep:
    name: MPF R / particle sweep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: MPF+TL R / particle sweep
        run: julia --project=. research/mpf_R_sweep.jl
        env:
          GKSwstype: '100'
      - name: Commit result CSV back to the branch
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f research/mpf_R_sweep_results.csv ] && git add -f research/mpf_R_sweep_results.csv || echo "no csv"
          if git diff --cached --quiet; then
            echo "No result CSV to commit."
          else
            git commit -m "Add MPF R-sweep result CSV [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mpf-rsweep-results
          path: research/mpf_R_sweep_results.csv
          if-no-files-found: ignore
