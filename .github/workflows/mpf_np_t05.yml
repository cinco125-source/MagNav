name: MPF particle ladder thresh=0.5

# Re-run the particle-count ladder at standard resampling (thresh=0.5) to see whether
# it reduces the EKF-class particle count below N=12000. offline-NN Mag 5, matched
# R=40 nT, roughen 5 m, N in {1000,4000}. Runs only research/mpf_np_t05.jl.

on:
  push:
    branches:
      - 'claude/continued-work-**'
    paths:
      - 'research/mpf_np_t05.jl'
      - 'research/mpf_logw.jl'
      - '.github/workflows/mpf_np_t05.yml'
  workflow_dispatch:

jobs:
  npt05:
    name: MPF particle ladder thresh=0.5
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: MPF particle ladder thresh=0.5
        run: julia --project=. research/mpf_np_t05.jl
        env:
          GKSwstype: '100'
      - name: Commit result CSV back to the branch
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f research/mpf_np_t05_results.csv ] && git add -f research/mpf_np_t05_results.csv || echo "no csv"
          if git diff --cached --quiet; then
            echo "No result CSV to commit."
          else
            git commit -m "Add MPF particle ladder thresh=0.5 CSV [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mpf-np-t05-results
          path: research/mpf_np_t05_results.csv
          if-no-files-found: ignore
